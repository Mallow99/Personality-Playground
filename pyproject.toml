[project]
name = "best-friend-initiative"
version = "0.1.0"
description = "A local character workbench and a foundation for personality-training research."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=1.7.4",
    "langmem>=0.0.30",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]
desktop = ["PySide6>=6.8,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
